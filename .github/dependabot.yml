version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(python):"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "types-*"
          - "git-filter-repo"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (keeps the pinned commit SHAs current)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions):"
    groups:
      actions:
        patterns:
          - "*"
