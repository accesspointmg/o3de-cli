name: Branch Guard

# Enforces the branch policy that repository rulesets cannot express.
# Rulesets can require a pull request, but not restrict which branch the pull
# request comes from -- so this check does it:
#
#   main         <- development only, from this repository (not a fork)
#   development  <- any branch except main
#
# The `check-source-branch` job is a required status check in the `main` and
# `development` rulesets, so a failure here blocks the merge.

on:
  pull_request:
    branches: [main, development]

permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          echo "pull request: $HEAD_REPO:$HEAD -> $BASE"
          case "$BASE" in
            main)
              # A fork can name its branch "development" too, so the source
              # repository has to be checked as well as the branch name.
              if [ "$HEAD" != "development" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
                echo "::error::main accepts pull requests only from $THIS_REPO:development, got '$HEAD_REPO:$HEAD'. Open your pull request against development instead."
                exit 1
              fi
              echo "OK: development into main"
              ;;
            development)
              if [ "$HEAD" = "main" ]; then
                echo "::error::development does not accept pull requests from main. Branch from development and open the pull request from that branch."
                exit 1
              fi
              echo "OK: '$HEAD' into development"
              ;;
            *)
              echo "no branch policy defined for base '$BASE', skipping"
              ;;
          esac
