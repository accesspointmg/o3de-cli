[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o3de-cli"
# Single source of truth is o3de_cli/__init__.py (__version__).
dynamic = ["version"]
description = "Package manager and CLI for the O3DE ecosystem"
readme = "README.md"
license = {text = "Apache-2.0 OR MIT"}
requires-python = ">=3.10"
authors = [
    {name = "O3DE Foundation", email = "info@o3de.org"}
]
keywords = ["o3de", "game-engine", "cli", "package-manager"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "resolvelib>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Tests must not reach the network; see [tool.pytest.ini_options].
    "pytest-socket>=0.7",
    # `object hoist` shells out to git filter-repo; its tests run it for real.
    "git-filter-repo>=2.38",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML",
    "types-jsonschema",
]
all = ["o3de-cli[dev]"]

[project.scripts]
o3de = "o3de_cli.__main__:main"
o3de-mcp = "o3de_cli.mcp_server:serve"

[project.urls]
Homepage = "https://github.com/accesspointmg/o3de-cli"
Documentation = "https://github.com/accesspointmg/o3de-cli#readme"
Repository = "https://github.com/accesspointmg/o3de-cli.git"
Issues = "https://github.com/accesspointmg/o3de-cli/issues"
Changelog = "https://github.com/accesspointmg/o3de-cli/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "o3de_cli.__version__"}

[tool.setuptools.packages.find]
where = ["."]
# Without this the wheel also installs `tests` as a top-level package.
include = ["o3de_cli*"]

[tool.setuptools.package-data]
o3de_cli = ["schemas/*.json", "schemas/SOURCE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # Line width is the formatter's concern. What survives `ruff format` is
    # long string literals and URLs it cannot break.
    "E501",
    # Unused imports cannot be auto-removed here: 70+ tests patch module
    # attributes (e.g. "o3de_cli.commands.registry.Resolver"), so deleting the
    # import deletes the patch target and the test errors out.
    "F401",
    # Quoted annotations are deliberate forward references ("ObjectType",
    # "Store") that exist to avoid circular imports; unquoting them raises
    # NameError at import time.
    "UP037",
]

[tool.mypy]
# Checked in CI (the `typecheck` job). Annotations are not required
# (no disallow_untyped_defs / warn_return_any), but the bodies of
# unannotated functions are still checked, which is where the useful
# None-handling errors turn up.
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

# Third-party modules with no type information: o3de_pilot_gui is an
# optional package that is not installed in CI, and git_filter_repo
# ships no stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["o3de_pilot_gui.*", "git_filter_repo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# No network in tests: a test that reaches out passes or fails on the state of
# someone else's server. Loopback stays open for asyncio's self-pipe.
addopts = "--allow-hosts=127.0.0.1,::1"

[tool.coverage.run]
omit = []

[tool.coverage.report]
# The measured floor, not an aspiration: raise it as coverage improves so it
# can only go up.
fail_under = 70
